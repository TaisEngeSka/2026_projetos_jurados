<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projetos dos Alunos — 2026</title>
    <style>
        :root {
            --azul: #078fc8;
            --fundo: #104d70;
            --painel: #075b87;
            --laranja: #ff9017;
            --marinho: #123e5d;
            --branco: #fff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #10486b, #075987);
            font-family: Arial, "Segoe UI", sans-serif;
            color: var(--branco)
        }

        button {
            font: inherit;
            cursor: pointer
        }

        .topo {
            height: 64px;
            padding: 7px 6.5%;
            display: flex;
            align-items: center;
            gap: 22px;
            background: var(--azul);
            border-bottom: 4px solid var(--laranja)
        }

        .marca {
            margin-right: auto;
            color: #063b59;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: -1px
        }

        .marca span {
            color: var(--laranja)
        }

        .marca b {
            font-size: 27px;
            margin-left: 5px
        }

        .botao {
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            background: var(--marinho);
            color: #fff
        }

        .botao:hover {
            background: #0b3451
        }

        .pagina-lista {
            max-width: 1120px;
            margin: 14px auto;
            padding: 0 16px 28px
        }

        .evento {
            margin: 0 0 4px;
            color: var(--azul);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase
        }

        .pagina-lista h1 {
            margin: 0 0 12px;
            font-size: 32px
        }

        .linha-titulo {
            margin-bottom: 14px;
            border-bottom: 1px solid #ffffff30
        }

        .turmas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 14px;
            align-items: start
        }

        .turma {
            padding: 10px 12px;
            border: 1px solid var(--azul);
            border-radius: 14px;
            background: #07577f
        }

        .turma h2 {
            margin: 0 0 12px;
            padding: 9px;
            border-left: 4px solid var(--laranja);
            border-radius: 10px;
            background: var(--azul);
            text-align: center;
            font-size: 14px
        }

        .jogos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 12px
        }

        .jogo-card {
            padding: 8px;
            border: 0;
            border-radius: 10px;
            background: var(--laranja);
            color: #fff;
            text-align: center;
            transition: transform .15s, filter .15s
        }

        .jogo-card:hover {
            transform: translateY(-3px);
            filter: brightness(1.08)
        }

        .capa {
            display: block;
            width: 100%;
            height: 60px;
            margin-bottom: 6px;
            border: 1px dashed #fff;
            border-radius: 7px;
            background: var(--marinho);
            object-fit: cover
        }

        .nome-jogo {
            display: block;
            font-weight: bold;
            font-size: 13px;
            line-height: 1.15
        }

        .nomes-alunos {
            display: block;
            margin-top: 4px;
            color: #fff4e8;
            font-size: 11px;
            line-height: 1.15
        }

        .visualizador {
            height: calc(100vh - 64px);
            min-height: 500px;
            padding: 10px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 12px
        }

        .moldura-jogo,
        .painel-turma {
            min-height: 0;
            padding: 8px;
            border: 1px solid #168fc0;
            border-radius: 14px;
            background: #075b87
        }

        .moldura-jogo iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 9px;
            background: #000
        }

        .painel-turma {
            overflow: auto;
            background: #07577f
        }

        .painel-turma h2 {
            margin: 3px 4px 12px;
            font-size: 20px
        }

        .foto-turma {
            display: block;
            width: 100%;
            max-height: calc(100vh - 170px);
            min-height: 160px;
            margin: 0 auto 8px;
            border-radius: 8px;
            background: var(--marinho);
            object-fit: contain
        }

        .legenda-turma {
            text-align: center;
            font-weight: bold
        }

        .sem-foto {
            display: grid;
            min-height: 150px;
            place-items: center;
            color: #c4dfed
        }

        .titulo-jogo {
            margin: 0 auto 0 0;
            font-size: 30px
        }

        .voltar {
            white-space: nowrap
        }

        .oculto {
            display: none !important
        }

        @media(max-width:760px) {
            .topo {
                padding: 7px 12px;
                gap: 10px
            }

            .marca {
                font-size: 18px
            }

            .pagina-lista {
                padding: 0 12px 24px
            }

            .pagina-lista h1,
            .titulo-jogo {
                font-size: 24px
            }

            .visualizador {
                height: auto;
                min-height: calc(100vh - 64px);
                grid-template-columns: 1fr
            }

            .moldura-jogo {
                height: 65vh;
                min-height: 340px
            }

            .painel-turma {
                display: grid;
                grid-template-columns: 1fr;
                justify-items: center
            }

            .painel-turma h2 {
                justify-self: start
            }

            .foto-turma {
                width: min(100%, 420px);
                max-height: 52vh
            }
        }
    </style>
</head>

<body>
    <header class="topo" id="topoLista">
        <div class="marca">SKA<span>TECHhub</span><b>»</b></div>
    </header>
    <header class="topo oculto" id="topoJogo">
        <button class="botao voltar" id="voltarTurmas" type="button">← Voltar às turmas</button>
        <h1 class="titulo-jogo" id="tituloJogo"></h1>
    </header>
    <main class="pagina-lista" id="paginaLista">
        <div class="linha-titulo">
            <p class="evento" id="evento"></p>
            <h1 id="tituloAno"></h1>
        </div>
        <section class="turmas" id="listaTurmas" aria-label="Jogos por turma"></section>
    </main>
    <main class="visualizador oculto" id="paginaJogo">
        <section class="moldura-jogo"><iframe id="frameJogo" title="Jogo dos alunos" allowfullscreen></iframe></section>
        <aside class="painel-turma">
            <h2>Turma</h2>
            <div id="fotoTurma"></div>
        </aside>
    </main>
    <script>

        const EVENTO = "Jornada Tecnológica";
        const ANO = "2026";
        const PROJETOS = [
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Calamidade",
                alunos: "Camila e Rafaela",
                capa: "imagens/capa_jogos/t1-camila-rafaela.png",
                arquivo: "jogos/t1-camila-rafaela.html"
            },
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Duck Go",
                alunos: "Érica, Juliana e Eduarda",
                capa: "imagens/capa_jogos/t1-erica-juli-eduarda.png",
                arquivo: "jogos/t1-erica-juli-eduarda.html"
            },
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Full Moon Night",
                alunos: "Kauane e Alice",
                capa: "imagens/capa_jogos/t1-kauane-alice.png",
                arquivo: "jogos/t1-kauane-alice.html"
            },
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Fifa em 2D",
                alunos: "Vitor e Wesley",
                capa: "imagens/capa_jogos/t1-vitor-wesley.png",
                arquivo: "jogos/t1-vitor-wesley.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Isto não é um jogo ",
                alunos: "Camilly e Matheus",
                capa: "imagens/capa_jogos/t2-camilly-matheus.png",
                arquivo: "jogos/t2-camilly-matheus.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Uma Viagem no Tempo",
                alunos: "Deise e Janaína",
                capa: "imagens/capa_jogos/t2-deise-janaina.png",
                arquivo: "jogos/t2-deise-janaina.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Corrida Relâmpago",
                alunos: "Gabriela e Fernanda",
                capa: "imagens/capa_jogos/t2-gabriela-fernanda.png",
                arquivo: "jogos/t2-gabriela-fernanda.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Lembrei",
                alunos: "Geovana e Yasmin",
                capa: "imagens/capa_jogos/t2-geovana-yasmin.png",
                arquivo: "jogos/t2-geovana-yasmin.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Velozes e Furiosos",
                alunos: "Luiz, Lucas e Ryan",
                capa: "imagens/capa_jogos/t2-luiz-lucas-ryan.png",
                arquivo: "jogos/t2-luiz-lucas-ryan.html"
            },
            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "Guerra da Luz",
                alunos: "Jessé, Lorenzo e Carlos",
                capa: "imagens/capa_jogos/t3-jesse-lorenzo-carlos.png",
                arquivo: "jogos/t3-jesse-lorenzo-carlos.html"
            },
            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "Labirinto do Bob Esponja",
                alunos: "Laura e Estephany",
                capa: "imagens/capa_jogos/t3-laura-stephany.png",
                arquivo: "jogos/t3-laura-stephany.html"
            },
            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "Magic Wards",
                alunos: "Arthur e André",
                capa: "imagens/capa_jogos/t3-arthur-andre.png",
                arquivo: "jogos/t3-arthur-andre.html"
            },
            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "Cafe Lily",
                alunos: "Bianca e Camille",
                capa: "imagens/capa_jogos/t3-bianca-camille.png",
                arquivo: "jogos/t3-bianca-camille.html"
            },
            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "AquaPega",
                alunos: "Isabeli e Brenda",
                capa: "imagens/capa_jogos/t3-isabelli-brenda.png",
                arquivo: "jogos/t3-isabelli-brenda.html"
            },
            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "Flappy Bus",
                alunos: "Jefferson e Milena",
                capa: "imagens/capa_jogos/t3-jeferson-milena.png",
                arquivo: "jogos/t3-jeferson-milena.html"
            },
        ];

        const porId = id => document.getElementById(id);
        function desenharTurmas() {
            porId("evento").textContent = EVENTO;
            porId("tituloAno").textContent = `Turmas de ${ANO}`;
            const grupos = new Map();
            PROJETOS.forEach(projeto => {
                if (!grupos.has(projeto.turma)) grupos.set(projeto.turma, []);
                grupos.get(projeto.turma).push(projeto);
            });
            const lista = porId("listaTurmas"); lista.replaceChildren();
            grupos.forEach((projetos, turma) => {
                const bloco = document.createElement("article"); bloco.className = "turma";
                const cabecalho = document.createElement("h2"); cabecalho.textContent = `${turma} — ${projetos[0].horario}`;
                const grade = document.createElement("div"); grade.className = "jogos";
                projetos.forEach(projeto => {
                    const botao = document.createElement("button"); botao.type = "button"; botao.className = "jogo-card";
                    const capa = document.createElement("img"); capa.className = "capa"; capa.src = projeto.capa; capa.alt = `Capa de ${projeto.titulo}`; capa.onerror = () => { capa.replaceWith(Object.assign(document.createElement("span"), { className: "capa", textContent: "Capa do projeto" })); };
                    const nome = document.createElement("span"); nome.className = "nome-jogo"; nome.textContent = projeto.titulo;
                    const alunos = document.createElement("span"); alunos.className = "nomes-alunos"; alunos.textContent = projeto.alunos;
                    botao.append(capa, nome, alunos); botao.addEventListener("click", () => abrirJogo(projeto)); grade.append(botao);
                });
                bloco.append(cabecalho, grade); lista.append(bloco);
            });
        }
        function abrirJogo(projeto) {
            porId("tituloJogo").textContent = projeto.titulo;
            const box = porId("fotoTurma"); box.replaceChildren();
            const foto = document.createElement("img"); foto.className = "foto-turma"; foto.src = projeto.fotoTurma; foto.alt = `Foto da ${projeto.turma}`;
            foto.onerror = () => { foto.replaceWith(Object.assign(document.createElement("div"), { className: "sem-foto", textContent: "Foto da turma indisponível" })); };
            box.append(foto); porId("frameJogo").src = projeto.arquivo || "about:blank";
            porId("topoLista").classList.add("oculto"); porId("paginaLista").classList.add("oculto");
            porId("topoJogo").classList.remove("oculto"); porId("paginaJogo").classList.remove("oculto");
        }
        function voltar() {
            porId("frameJogo").src = "about:blank"; porId("topoJogo").classList.add("oculto"); porId("paginaJogo").classList.add("oculto");
            porId("topoLista").classList.remove("oculto"); porId("paginaLista").classList.remove("oculto");
        }
        porId("voltarTurmas").addEventListener("click", voltar);
        document.addEventListener("keydown", evento => { if (evento.key === "Escape" && !porId("paginaJogo").classList.contains("oculto")) voltar(); });
        desenharTurmas();
    </script>
</body>

</html>
