
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projetos dos Alunos — 2026</title>
    <link rel="stylesheet" href="./projetos.css">
</head>

<body>
    <header class="topo" id="topoLista">
        <img class="marca" src="imagens/logoska.png" alt="SKA TECHhub">
    </header>
    <header class="topo oculto" id="topoJogo">
        <button class="botao voltar" id="voltarTurmas" type="button">← Voltar às turmas</button>
        <h1 class="titulo-jogo" id="tituloJogo"></h1>
    </header>
    <main class="pagina-lista" id="paginaLista">
        <div class="linha-titulo">
            <p class="evento" id="evento"></p>
            <h1 id="tituloAno"></h1>
        </div>
        <section class="turmas" id="listaTurmas" aria-label="Jogos por turma"></section>
    </main>
    <main class="visualizador oculto" id="paginaJogo">
        <section class="moldura-jogo"><iframe id="frameJogo" title="Jogo dos alunos" allowfullscreen></iframe></section>
        <aside class="painel-turma">
            <h2>Turma</h2>
            <div id="fotoTurma"></div>
        </aside>
    </main>
    <script>

        const EVENTO = "Jornada Tecnológica";
        const ANO = "2026";
        const PROJETOS = [
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Calamidade",
                alunos: "Camila e Rafaela",
                capa: "imagens/capa_jogos/t1-camila-rafaela.png",
                arquivo: "jogos/Calamidade.html"
            },
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Duck Go",
                alunos: "Érica, Juliana e Eduarda",
                capa: "imagens/capa_jogos/t1-erica-juli-eduarda.png",
                arquivo: "jogos/t1-erica-juli-eduarda.html"
            },
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Full Moon Night",
                alunos: "Kauane e Alice",
                capa: "imagens/capa_jogos/t1-kauane-alice.png",
                arquivo: "jogos/full_moon_night.html"
            },
            {
                turma: "T1", horario: "Quinta-feira / Manhã",
                fotoTurma: "imagens/turmas/t1.png",
                titulo: "Fifa em 2D",
                alunos: "Vitor e Wesley",
                capa: "imagens/capa_jogos/t1-vitor-wesley.png",
                arquivo: "jogos/t1-vitor-wesley.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Isto não é um jogo ",
                alunos: "Camilly e Matheus",
                capa: "imagens/capa_jogos/t2-camilly-matheus.png",
                arquivo: "jogos/isto não é um jogo.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Uma Viagem no Tempo",
                alunos: "Deise e Janaína",
                capa: "imagens/capa_jogos/t2-deise-janaina.png",
                arquivo: "jogos/UMA VIAGEM NO TEMPO.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Corrida Relâmpago",
                alunos: "Gabriela e Fernanda",
                capa: "imagens/capa_jogos/t2-gabriela-fernanda.png",
                arquivo: "jogos/Corrida Relâmpago remix.html"
            },
            {
                turma: "T2", horario: "Quinta-feira / Tarde",
                fotoTurma: "imagens/turmas/t2.png",
                titulo: "Lembrei",
                alunos: "Geovana e Yasmin",
                capa: "imagens/capa_jogos/t2-geovana-yasmin.png",

            },
            {

            },
            {

                titulo: "Guerra da Luz",
                alunos: "Jessé, Lorenzo e Carlos",
                capa: "imagens/capa_jogos/t3-jesse-lorenzo-carlos.png",

            },
            {

                fotoTurma: "imagens/turmas/t3.png",
                titulo: "Labirinto do Bob Esponja",

                capa: "imagens/capa_jogos/t3-laura-stephany.png",

            },
            {

            {

                fotoTurma: "imagens/turmas/t3.png",

            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "AquaPega",
                alunos: "Isabeli e Brenda",
                capa: "imagens/capa_jogos/t3-isabelli-brenda.png",
                arquivo: "jogos/aquapega .html"
            },
            {
                turma: "T3", horario: "Sábado",
                fotoTurma: "imagens/turmas/t3.png",
                titulo: "Flappy Bus",
                alunos: "Jefferson e Milena",
                capa: "imagens/capa_jogos/t3-jeferson-milena.png",
                arquivo: "jogos/Flappy Bus.html"
            },
        ];

        const porId = id => document.getElementById(id);
        function desenharTurmas() {
            porId("evento").textContent = EVENTO;
            porId("tituloAno").textContent = `Turmas de ${ANO}`;
            const grupos = new Map();
            PROJETOS.forEach(projeto => {
                if (!grupos.has(projeto.turma)) grupos.set(projeto.turma, []);
                grupos.get(projeto.turma).push(projeto);
            });
            const lista = porId("listaTurmas"); lista.replaceChildren();
            grupos.forEach((projetos, turma) => {
                const bloco = document.createElement("article"); bloco.className = "turma";
                const cabecalho = document.createElement("h2"); cabecalho.textContent = `${turma} — ${projetos[0].horario}`;
                const grade = document.createElement("div"); grade.className = "jogos";
                projetos.forEach(projeto => {
                    const botao = document.createElement("button"); botao.type = "button"; botao.className = "jogo-card";
                    const capa = document.createElement("img"); capa.className = "capa"; capa.src = projeto.capa; capa.alt = `Capa de ${projeto.titulo}`; capa.onerror = () => { capa.replaceWith(Object.assign(document.createElement("span"), { className: "capa", textContent: "Capa do projeto" })); };
                    const nome = document.createElement("span"); nome.className = "nome-jogo"; nome.textContent = projeto.titulo;
                    const alunos = document.createElement("span"); alunos.className = "nomes-alunos"; alunos.textContent = projeto.alunos;
                    botao.append(capa, nome, alunos); botao.addEventListener("click", () => abrirJogo(projeto)); grade.append(botao);
                });
                bloco.append(cabecalho, grade); lista.append(bloco);
            });
        }
        function abrirJogo(projeto) {
            porId("tituloJogo").textContent = projeto.titulo;
            const box = porId("fotoTurma"); box.replaceChildren();
            const cartao = document.createElement("div"); cartao.className = "cartao-turma";
            const foto = document.createElement("img"); foto.className = "foto-turma"; foto.src = projeto.fotoTurma; foto.alt = `Foto da ${projeto.turma}`;
            foto.onerror = () => { foto.replaceWith(Object.assign(document.createElement("div"), { className: "sem-foto", textContent: "Foto da turma indisponível" })); };
            const creditos = document.createElement("p"); creditos.className = "creditos-turma";
            creditos.append("Projeto desenvolvido por");
            const nomes = document.createElement("strong"); nomes.textContent = projeto.alunos;
            creditos.append(nomes);
            cartao.append(foto, creditos); box.append(cartao);
            porId("frameJogo").src = projeto.arquivo || "about:blank";
            porId("topoLista").classList.add("oculto"); porId("paginaLista").classList.add("oculto");
            porId("topoJogo").classList.remove("oculto"); porId("paginaJogo").classList.remove("oculto");
        }
        function voltar() {
            porId("frameJogo").src = "about:blank"; porId("topoJogo").classList.add("oculto"); porId("paginaJogo").classList.add("oculto");
            porId("topoLista").classList.remove("oculto"); porId("paginaLista").classList.remove("oculto");
        }
        porId("voltarTurmas").addEventListener("click", voltar);
        document.addEventListener("keydown", evento => { if (evento.key === "Escape" && !porId("paginaJogo").classList.contains("oculto")) voltar(); });
        desenharTurmas();
    </script>
</body>

</html>
